<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>CodePad</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <div class="app">


    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

      <div class="brand">

        <div class="logo-mark">
          &lt;/&gt;
        </div>

        <div>

          <h1>CodePad</h1>

          <span>
            Simple. Fast. Yours.
          </span>

        </div>

      </div>


      <div class="top-actions">

        <button
          class="icon-button"
          id="newFileButton"
          title="New File"
        >
          +
        </button>


        <button
          class="small-button"
          id="importButton"
        >
          Import
        </button>


        <button
          class="small-button"
          id="exportButton"
        >
          Export File
        </button>


        <button
          class="primary-button"
          id="exportProjectButton"
        >
          Export Project
        </button>

      </div>

    </header>



    <!-- =========================
         MAIN WORKSPACE
    ========================== -->

    <main class="workspace">


      <!-- =========================
           SIDEBAR
      ========================== -->

      <aside class="sidebar">


        <div class="project-header">

          <div>

            <div class="small-label">
              PROJECT
            </div>

            <div
              class="project-name"
              id="projectName"
            >
              Untitled Project
            </div>

          </div>


          <button
            class="icon-button"
            id="renameProjectButton"
            title="Rename Project"
          >
            ✎
          </button>

        </div>



        <div class="sidebar-title">

          <span>
            FILES
          </span>


          <button
            id="addFileButton"
            title="Add File"
          >
            +
          </button>

        </div>



        <div
          class="file-list"
          id="fileList"
        >
        </div>



        <div class="sidebar-footer">

          <button
            id="emptyNewFileButton"
          >
            + New File
          </button>

        </div>


      </aside>



      <!-- =========================
           EDITOR
      ========================== -->

      <section class="editor-area">


        <!-- TABS -->

        <div
          class="tabs"
          id="tabs"
        >
        </div>



        <!-- EMPTY STATE -->

        <div
          class="empty-state hidden"
          id="emptyState"
        >

          <div class="empty-icon">
            &lt;/&gt;
          </div>


          <h2>
            No file open
          </h2>


          <p>
            Create or import a file to start coding.
          </p>


          <button
            class="primary-button"
            id="emptyNewFileButton2"
            onclick="document.getElementById('newFileButton').click()"
          >
            Create File
          </button>

        </div>



        <!-- CODE EDITOR -->

        <div
          class="editor-wrapper"
          id="editorWrapper"
        >

          <pre
            class="line-numbers"
            id="lineNumbers"
          >1</pre>


          <textarea
            id="editor"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            placeholder="Start typing..."
          ></textarea>

        </div>



        <!-- STATUS BAR -->

        <footer class="statusbar">

          <div
            id="fileStatus"
          >
            No file open
          </div>


          <div class="status-right">

            <span
              id="languageStatus"
            >
              Plain Text
            </span>


            <span
              id="cursorStatus"
            >
              Ln 1, Col 1
            </span>

          </div>

        </footer>


      </section>


    </main>


  </div>



  <!-- =========================
       IMPORT INPUT
  ========================== -->

  <input
    type="file"
    id="fileInput"
    multiple
    hidden
  >



  <!-- =========================
       MODAL
  ========================== -->

  <div
    class="modal-overlay hidden"
    id="modalOverlay"
  >

    <div class="modal">

      <h2
        id="modalTitle"
      >
        New File
      </h2>


      <p
        id="modalText"
      >
        Enter a filename.
      </p>


      <input
        type="text"
        id="modalInput"
        placeholder="filename"
        autocomplete="off"
      >


      <div class="modal-actions">

        <button
          class="secondary-button"
          id="modalCancel"
        >
          Cancel
        </button>


        <button
          class="primary-button"
          id="modalConfirm"
        >
          Create
        </button>

      </div>

    </div>

  </div>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    src="app.js"
  ></script>


</body>

</html>
