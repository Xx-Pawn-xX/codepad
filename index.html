<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090909">

  <title>CodePad</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="brand">
      <div class="logo-mark">&lt;/&gt;</div>

      <div>
        <h1>CodePad</h1>
        <span>Simple. Local. Yours.</span>
      </div>
    </div>

    <div class="top-actions">

      <button class="icon-button" id="renameProjectButton">✎</button>

      <button class="icon-button" id="importButton">↑</button>

      <button class="icon-button" id="exportButton">↓</button>

      <button class="primary-button" id="exportProjectButton">
        Export Project
      </button>

    </div>

  </header>


  <main class="workspace">

    <aside class="sidebar">

      <div class="project-header">

        <div>
          <div class="small-label">PROJECT</div>
          <div class="project-name" id="projectName">
            Untitled Project
          </div>
        </div>

        <button class="icon-button project-new" id="newFileButton">
          +
        </button>

      </div>


      <div class="sidebar-title">

        <span>FILES</span>

        <button id="addFileButton">+</button>

      </div>


      <div class="file-list" id="fileList"></div>


      <div class="sidebar-footer">

        <button id="importSidebarButton">
          Import Files
        </button>

      </div>

    </aside>


    <section class="editor-area">

      <div class="tabs" id="tabs"></div>


      <!-- OUR OWN EDITOR -->

      <div class="editor-wrapper" id="editorWrapper">

        <pre id="highlighting"
             aria-hidden="true"><code id="highlightedCode"></code></pre>

        <textarea
          id="editor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
        ></textarea>


        <!-- AUTOCOMPLETE -->

        <div id="suggestions" class="suggestions hidden"></div>

      </div>


      <div class="empty-state hidden" id="emptyState">

        <div class="empty-icon">&lt;/&gt;</div>

        <h2>Ready when you are.</h2>

        <p>Create a file and start writing.</p>

        <button class="primary-button" id="emptyNewFileButton">
          Create File
        </button>

      </div>


      <div class="statusbar">

        <div id="fileStatus">No file open</div>

        <div class="status-right">
          <span id="languageStatus">Plain Text</span>
          <span id="cursorStatus">Ln 1, Col 1</span>
        </div>

      </div>

    </section>

  </main>

</div>


<input type="file"
       id="fileInput"
       multiple
       hidden>


<!-- MODAL -->

<div class="modal-overlay hidden" id="modalOverlay">

  <div class="modal">

    <h2 id="modalTitle">Create New File</h2>

    <p id="modalText">
      Choose a file type.
    </p>

    <input
      type="text"
      id="modalInput"
      placeholder="Filename"
    >

    <div class="modal-actions">

      <button class="secondary-button" id="modalCancel">
        Cancel
      </button>

      <button class="primary-button" id="modalConfirm">
        Create
      </button>

    </div>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
